name: WaveSight Business Signals PR

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Asia/Shanghai date to run, formatted as YYYY-MM-DD. Leave empty for today."
        required: false
        type: string
      pass_score:
        description: "Source-intake diagnostic score reference. V4 integrity, application projection, and frontstage gates decide release."
        required: false
        default: "85"
        type: string
      resume_run_id:
        description: "Failed same-date run whose accepted collection artifact should be reused. Leave empty for a fresh collection."
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: wavesight-business-signals-${{ github.event.inputs.date || github.ref_name }}
  cancel-in-progress: false

jobs:
  business-signals-pr:
    name: Business Signals Scheduled PR
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai
      ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TAVILY_DISABLED: "true"
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_FLASH_MODEL: deepseek-v4-flash
      DEEPSEEK_PRO_MODEL: deepseek-v4-pro
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
      GUANLAN_EVIDENCE_BACKUP_ROOT: ${{ github.workspace }}/../WaveSight-private-evidence

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out authoritative private evidence store
        env:
          PRIVATE_EVIDENCE_SSH_KEY: ${{ secrets.PRIVATE_EVIDENCE_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_EVIDENCE_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_EVIDENCE_SSH_KEY" > "$HOME/.ssh/wavesight_private_evidence"
          chmod 600 "$HOME/.ssh/wavesight_private_evidence"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/wavesight_private_evidence -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth=1 git@github.com:jerryfang2023-stack/WaveSight-private-evidence.git "$GUANLAN_EVIDENCE_BACKUP_ROOT"
          echo "GIT_SSH_COMMAND=$GIT_SSH_COMMAND" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert private evidence remote boundary
        run: npm run assert:private-evidence-remote

      - name: Resolve run date
        id: run-date
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            run_date="${{ github.event.inputs.date }}"
          else
            run_date="$(TZ=Asia/Shanghai date +%F)"
          fi

          if ! [[ "$run_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $run_date" >&2
            exit 2
          fi

          echo "date=$run_date" >> "$GITHUB_OUTPUT"
          echo "RUN_DATE=$run_date" >> "$GITHUB_ENV"

      - name: Check existing business-signal assets
        id: existing-assets
        shell: bash
        run: |
          set -euo pipefail
          skip=false
          reason="not_applicable"
          branch_exists=false

          intake_file="01-SiteV2/content/11-databases/data-center-v4/intake-v1/${RUN_DATE}.json"
          data_center_manifest="01-SiteV2/content/11-databases/data-center-v4/${RUN_DATE}/manifest.json"
          telemetry_file="01-SiteV2/site/data/collection-telemetry-v1.json"
          branch="automation/business-signals-${RUN_DATE}"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            branch_exists=true
          fi

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -f "$intake_file" ] && [ -f "$data_center_manifest" ] && [ -f "$telemetry_file" ]; then
              if node agent-workflow/tools/assert-data-center-v4.mjs --date="${RUN_DATE}" >/tmp/data-center-v4-health.log 2>&1 \
                && node agent-workflow/tools/assert-funding-insights-v1.mjs --date="${RUN_DATE}" >/tmp/funding-insights-health.log 2>&1 \
                && node agent-workflow/tools/assert-daily-production-chain.mjs --date="${RUN_DATE}" --stage=pre-commit --block-stale=true >/tmp/business-chain-health.log 2>&1; then
                skip=true
                reason="same-date structured intake, V4 materialization, applications, and operations data pass"
              else
                reason="same-date files exist but current gates do not pass; continue targeted production"
                cat /tmp/data-center-v4-health.log 2>/dev/null || true
                cat /tmp/business-chain-health.log 2>/dev/null || true
              fi
            fi
          fi

          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "branch_exists=$branch_exists" >> "$GITHUB_OUTPUT"
          echo "skip_business_signal_assets=$skip"
          echo "business_signal_skip_reason=$reason"
          echo "existing_automation_branch=$branch_exists"

      - name: Report cloud dependency state
        shell: bash
        run: |
          {
            echo "# GitHub Business Signals PR"
            echo
            echo "- date: ${RUN_DATE}"
            echo "- generated_at: $(date -Is)"
            echo "- mode: business_signals_pr"
            echo "- trigger: ${{ github.event_name }}"
            echo "- schedule: local 08:10 conditional dispatch; 09:15 targeted recovery; 10:30 cloud safety fallback"
            echo "- business_signal_skip: ${{ steps.existing-assets.outputs.skip }}"
            echo "- business_signal_skip_reason: ${{ steps.existing-assets.outputs.reason }}"
            echo "- existing_automation_branch: ${{ steps.existing-assets.outputs.branch_exists }}"
            echo "- anysearch_secret: $([ -n "$ANYSEARCH_API_KEY" ] && echo configured || echo missing)"
            echo "- tavily_secret: $([ "$TAVILY_DISABLED" = "true" ] && echo disabled || ([ -n "$TAVILY_API_KEY" ] && echo configured || echo missing))"
            echo "- exa_secret: $([ -n "$EXA_API_KEY" ] && echo configured || echo missing)"
            echo "- deepseek_v4_title_translation: $([ -n "$DEEPSEEK_API_KEY" ] && echo configured || echo missing)"
            echo
            echo "This V4 workflow stores complete originals only in the private evidence repository and commits body-free locators, the factual bundle, application projections, and operations data to an automation branch."
            echo "The source collector writes SourceArtifact / RawDocument intake directly; legacy compatibility writers are disabled."
            echo "AI HOT, keyword, GDELT, and RSS are collected as independent source artifacts before V4 normalization."
            echo "First-line viewpoints are produced by .github/workflows/daily-first-line-viewpoints-pr.yml and are not part of this business-signal PR."
            echo "It never pushes directly to main. GitHub Pages deploys automatically after the PR merge updates main."
            echo
            echo "Production order:"
            echo "1. Collect source Raw artifacts independently and in parallel."
            echo "2. Build and gate structured SourceArtifact / RawDocument intake."
            echo "3. Confirm source integrity and historical duplicate state."
            echo "4. Build and gate the Data Center V4 factual bundle."
            echo "5. Materialize V4 JSONL serving tables."
            echo "6. Build Opportunity Map, Trend Radar, and Funding Insights projections."
            echo "7. Build operations data after V4 materialization."
            echo "8. Confirm same-date downstream assets are no longer stale."
            echo "9. Write a persistent asset manifest."
            echo "10. Commit generated assets to an automation branch and open or update a PR."
            echo "11. Auto-merge the PR after all gates pass, so main triggers GitHub Pages deployment."
            echo
            echo "Skipped by design:"
            echo "- paused opinion lane."
            echo "- Direct main commit."
            echo "- Direct deploy from the automation branch."
          } | tee "agent-workflow/reports/${RUN_DATE}-github-daily-persistent-assets-pr.md"

      - name: Syntax checks
        shell: bash
        run: |
          node --check agent-workflow/tools/run-guanlan-daily-monitor.mjs
          node --check agent-workflow/tools/run-guanlan-daily-monitor-with-qc.mjs
          node --check agent-workflow/tools/run-daily-automation-controller.mjs
          node --check agent-workflow/tools/run-business-signals-health-dispatch.mjs
          node --check agent-workflow/tools/build-data-center-v4.mjs
          node --check agent-workflow/tools/backfill-data-center-v4.mjs
          node --check agent-workflow/tools/assert-data-center-v4.mjs
          node --check agent-workflow/tools/build-guanlan-vault.mjs
          node --check agent-workflow/tools/assert-tag-taxonomy-v4.mjs
          node --check agent-workflow/tools/event-public-title.mjs
          node --check agent-workflow/tools/sync-light-data-lake.mjs
          node --check agent-workflow/tools/assert-data-lake-v4.mjs
          node --check 01-SiteV2/site/scripts/build-data-center-v4-frontstage.mjs
          node --check 01-SiteV2/site/scripts/build-industry-reports-frontstage.mjs
          node --check agent-workflow/tools/assert-daily-production-chain.mjs
          node agent-workflow/tools/assert-compatibility-retirement.mjs
          node agent-workflow/tools/assert-business-signals-pipeline-policy.mjs
          node --check agent-workflow/tools/classify-business-signals-production-state.mjs
          node --check agent-workflow/tools/frontstage-regression-gate.mjs
          node --check agent-workflow/tools/assert-community-intelligence-data.mjs
          node --check agent-workflow/tools/send-feishu-webhook.mjs
          node --check 01-SiteV2/site/scripts/sync-pipeline-dashboard-data.mjs
          gh --version
          npm run test:data-center

      - name: Restore accepted source intake from failed run
        id: resume-artifact
        if: steps.existing-assets.outputs.skip != 'true' && github.event.inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PR_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          resume_run_id="${{ github.event.inputs.resume_run_id }}"
          artifact_name="wavesight-business-signals-pr-${RUN_DATE}"

          if ! [[ "$resume_run_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid resume_run_id: $resume_run_id" >&2
            exit 2
          fi

          run_json="$(gh run view "$resume_run_id" --json workflowName,conclusion,jobs)"
          RUN_JSON="$run_json" node --input-type=module <<'NODE'
          const run = JSON.parse(process.env.RUN_JSON || "{}");
          // Reuse only a collection whose monitor quality gate passed. The
          // post-monitor handoff and private evidence boundary rerun below.
          const requiredSteps = [
            "Collect source raw artifacts",
            "Run Daily Monitor with QC",
          ];
          if (run.workflowName !== "WaveSight Business Signals PR" || run.conclusion !== "failure") {
            throw new Error("Resume source must be a failed WaveSight Business Signals PR run.");
          }
          const steps = (run.jobs || []).flatMap((job) => job.steps || []);
          for (const name of requiredSteps) {
            const step = steps.find((candidate) => candidate.name === name);
            if (step?.conclusion !== "success") {
              throw new Error(`Resume source is not reusable: ${name} concluded ${step?.conclusion || "missing"}.`);
            }
          }
          NODE

          artifact_ready="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${resume_run_id}/artifacts" \
            --jq ".artifacts | any(.name == \"${artifact_name}\" and (.expired | not))")"
          if [ "$artifact_ready" != "true" ]; then
            echo "Reusable artifact is missing or expired: $artifact_name" >&2
            exit 1
          fi

          resume_dir="$(mktemp -d)"
          trap 'rm -rf -- "$resume_dir"' EXIT
          gh run download "$resume_run_id" --name "$artifact_name" --dir "$resume_dir"
          cp -a "$resume_dir/." .
          node agent-workflow/tools/assert-daily-production-chain.mjs \
            --date="${RUN_DATE}" \
            --stage=post-monitor

          echo "used=true" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$resume_run_id" >> "$GITHUB_OUTPUT"
          echo "Restored accepted source intake from failed run $resume_run_id without recollection."

      - name: Collect source raw artifacts
        id: source-artifacts
        if: steps.existing-assets.outputs.skip != 'true' && steps.resume-artifact.outputs.used != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "agent-workflow/reports/source-runs/${RUN_DATE}"
          sources=(aihot keyword gdelt rss)
          pids=()
          logs=()
          source_timeout="${SOURCE_COLLECTION_TIMEOUT:-12m}"

          for source in "${sources[@]}"; do
            log_file="agent-workflow/reports/source-runs/${RUN_DATE}/${source}-source-run.log"
            logs+=("$log_file")
            {
              timeout "$source_timeout" node agent-workflow/tools/run-guanlan-daily-monitor.mjs \
                --date="${RUN_DATE}" \
                --source-only="$source" \
                --source-artifact-dir="agent-workflow/reports/source-runs/${RUN_DATE}" \
                --search-limit=200 \
                --search-path-query-limit=5 \
                --gdelt-query-limit=12 \
                --hn-limit=8 \
                --raw-dedupe-buffer=140 \
                --raw-max=360 \
                --fetch-timeout-ms=20000
            } >"$log_file" 2>&1 &
            pids+=("$!")
          done

          failed=0
          for index in "${!pids[@]}"; do
            source="${sources[$index]}"
            log_file="${logs[$index]}"
            if wait "${pids[$index]}"; then
              echo "Source collection succeeded: $source"
            else
              echo "Source collection failed: $source" >&2
              failed=1
              printf '{"date":"%s","generated_at":"%s","mode":"data_center_source_intake","source_id":"%s","source_label":"%s","status":"failed","discovered_count":0,"source_candidate_count":0,"failures":["source collection command failed; see %s-source-run.log"],"items":[]}\n' \
                "$RUN_DATE" "$(date -Is)" "$source" "$source" "$source" \
                > "agent-workflow/reports/source-runs/${RUN_DATE}/${source}-source-intake-candidates.json"
            fi
            echo "--- ${source} source log ---"
            cat "$log_file"
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more source lanes failed; continuing to unified monitor so quality gates can decide release." >&2
          fi

      - name: Run Daily Monitor with QC
        id: monitor
        if: steps.existing-assets.outputs.skip != 'true' && steps.resume-artifact.outputs.used != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node agent-workflow/tools/run-guanlan-daily-monitor-with-qc.mjs \
            --date="${RUN_DATE}" \
            --pass-score="${{ github.event.inputs.pass_score || '85' }}" \
            --max-cycles=1 \
            --search-limit=200 \
            --search-path-query-limit=5 \
            --gdelt-query-limit=12 \
            --hn-limit=8 \
            --raw-dedupe-buffer=140 \
            --raw-max=360 \
            --fetch-timeout-ms=20000 \
            --snapshot-timeout-ms=16000 \
            --use-source-artifacts=true \
            --source-artifact-dir="agent-workflow/reports/source-runs/${RUN_DATE}" \
            --source-refresh-timeout-ms=900000 \
            --monitor-timeout-ms=900000 \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-persistent-assets-pr-monitor-run.log"

      - name: Confirm V4 source-intake handoff and dedupe state
        id: persistent-assets-post-monitor
        if: always() && steps.existing-assets.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node agent-workflow/tools/assert-daily-production-chain.mjs \
            --date="${RUN_DATE}" \
            --stage=post-monitor \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-persistent-assets-pr-post-monitor-gate.log"
          npm run assert:china-market -- --date="${RUN_DATE}"

      - name: Persist originals privately and enforce the public boundary
        id: evidence-boundary
        if: always() && steps.existing-assets.outputs.skip != 'true' && (steps.monitor.outcome == 'success' || steps.resume-artifact.outputs.used == 'true')
        shell: bash
        run: |
          set -euo pipefail
          npm run assert:private-evidence-remote
          npm run backup:private-evidence
          npm run migrate:private-evidence
          npm run assert:private-evidence-backup -- --date="${RUN_DATE}"
          npm run assert:public-evidence-boundary
          git -C "$GUANLAN_EVIDENCE_BACKUP_ROOT" config user.name "github-actions[bot]"
          git -C "$GUANLAN_EVIDENCE_BACKUP_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GUANLAN_EVIDENCE_BACKUP_ROOT" add -A
          if ! git -C "$GUANLAN_EVIDENCE_BACKUP_ROOT" diff --cached --quiet; then
            git -C "$GUANLAN_EVIDENCE_BACKUP_ROOT" commit -m "Persist private evidence for ${RUN_DATE}"
            git -C "$GUANLAN_EVIDENCE_BACKUP_ROOT" pull --rebase origin main
            npm run assert:private-evidence-remote
            git -C "$GUANLAN_EVIDENCE_BACKUP_ROOT" push origin HEAD:main
          fi

      - name: Build Data Center V4 factual bundle
        id: data-center-v4
        if: (steps.monitor.outcome == 'success' || steps.resume-artifact.outputs.used == 'true') && steps.persistent-assets-post-monitor.outcome == 'success' && steps.evidence-boundary.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node agent-workflow/tools/build-data-center-v4.mjs \
            --date="${RUN_DATE}" \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-persistent-assets-pr-data-center-v4.log"

      - name: Generate evidence-bounded DeepSeek candidates
        id: data-center-v4-model-assist
        if: steps.data-center-v4.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node agent-workflow/tools/generate-data-center-model-assist.mjs \
            --date="${RUN_DATE}" --write=true --concurrency=2 \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-model-assist.log"
          node agent-workflow/tools/assert-data-center-model-assist.mjs --date="${RUN_DATE}"

      - name: Rebuild Data Center V4 with accepted model candidates
        id: data-center-v4-model-rebuild
        if: steps.data-center-v4-model-assist.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node agent-workflow/tools/build-data-center-v4.mjs --date="${RUN_DATE}" \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-data-center-v4-model-rebuild.log"

      - name: Run Data Center V4 integrity gate
        id: data-center-v4-gate
        if: always() && steps.data-center-v4.outcome == 'success' && steps.data-center-v4-model-rebuild.outcome != 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node agent-workflow/tools/assert-data-center-v4.mjs \
            --date="${RUN_DATE}" \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-persistent-assets-pr-data-center-v4-gate.log"

      - name: Materialize Data Center V4 JSONL tables
        id: data-center-v4-materialize
        if: steps.data-center-v4-gate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node agent-workflow/tools/sync-light-data-lake.mjs \
            --v4-only=true \
            --duckdb=skip \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-persistent-assets-pr-data-center-v4-materialize.log"
          node agent-workflow/tools/assert-data-lake-v4.mjs \
            --duckdb=skip \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-persistent-assets-pr-data-lake-v4-gate.log"
          node 01-SiteV2/site/scripts/build-data-center-v4-frontstage.mjs \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-persistent-assets-pr-data-center-v4-frontstage.log"
          npm run test:data-center-site:core

      - name: Build and gate Opportunity Map V4 projection
        id: opportunity-map-v4
        if: steps.data-center-v4-materialize.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node 01-SiteV2/site/scripts/build-industry-reports-frontstage.mjs \
            --date="${RUN_DATE}" \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-persistent-assets-pr-opportunity-map-v4.log"
          npm run test:data-center-site:opportunity

      - name: Build and gate Trend Radar projection
        id: trend-radar-projection
        if: steps.data-center-v4-materialize.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node 01-SiteV2/site/scripts/build-trend-radar-frontstage.mjs \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-persistent-assets-pr-trend-radar.log"
          node agent-workflow/tools/assert-trend-radar-v1.mjs
          npm run test:trend-radar

      - name: Research, gate, and publish Funding Insights
        id: funding-insights
        if: steps.data-center-v4-materialize.outcome == 'success'
        continue-on-error: true
        env:
          TAVILY_DISABLED: "false"
        shell: bash
        run: |
          set -euo pipefail
          node agent-workflow/tools/generate-funding-insights-deepseek.mjs \
            --date="${RUN_DATE}" \
            --write=true \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-persistent-assets-pr-funding-insights.log"
          node agent-workflow/tools/assert-funding-insights-v1.mjs --date="${RUN_DATE}"
          node 01-SiteV2/site/scripts/build-funding-insights-frontstage.mjs
          node agent-workflow/tools/assert-funding-insights-v1.mjs --all=true --frontstage=true
          npm run test:funding-insights

      - name: Sync operations data after V4 production
        id: operations-data
        if: always() && steps.data-center-v4-materialize.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node agent-workflow/tools/build-collection-telemetry-v1.mjs \
            --date="${RUN_DATE}" \
            --opportunity="${{ steps.opportunity-map-v4.outcome }}" \
            --trend="${{ steps.trend-radar-projection.outcome }}" \
            --funding="${{ steps.funding-insights.outcome }}" \
            --lenses=local_projection \
            --publication=waiting \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-persistent-assets-pr-collection-telemetry.log"
          node 01-SiteV2/site/scripts/sync-pipeline-dashboard-data.mjs \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-persistent-assets-pr-operations-data.log"
          node agent-workflow/tools/build-ops-console-data.mjs

      - name: Confirm site data freshness
        id: pre-commit-gate
        if: steps.data-center-v4-materialize.outcome == 'success' && steps.operations-data.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node agent-workflow/tools/assert-daily-production-chain.mjs \
            --date="${RUN_DATE}" \
            --stage=pre-commit \
            --block-stale=true \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-persistent-assets-pr-pre-commit-gate.log"

      - name: Write persistent asset manifest
        id: persistent-manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent-workflow/reports

          state_for() {
            local path="$1"
            if [ -e "$path" ]; then
              echo "present"
            else
              echo "missing"
            fi
          }

          cat > "agent-workflow/reports/${RUN_DATE}-persistent-asset-manifest.md" <<EOF
          # ${RUN_DATE} Data Center V4 Asset Manifest

          - generated_at: $(date -Is)
          - workflow_mode: business_signals_pr
          - monitor: ${{ steps.resume-artifact.outputs.used == 'true' && 'restored' || steps.monitor.outcome }}
          - resumed_from_run: ${{ steps.resume-artifact.outputs.source_run_id || 'none' }}
          - structured_intake_gate: ${{ steps.persistent-assets-post-monitor.outcome }}
          - data_center_v4_build: ${{ steps.data-center-v4.outcome }}
          - data_center_v4_gate: ${{ steps.data-center-v4-gate.outcome }}
          - data_center_v4_materialize: ${{ steps.data-center-v4-materialize.outcome }}
          - trend_radar_projection: ${{ steps.trend-radar-projection.outcome }}
          - funding_insights: ${{ steps.funding-insights.outcome }}
          - operations_data_sync: ${{ steps.operations-data.outcome }}
          - pre_commit_gate: ${{ steps.pre-commit-gate.outcome }}

          ## Persisted Asset State

          | Asset | State |
          |---|---|
          | Structured SourceArtifact / RawDocument intake | $(state_for "01-SiteV2/content/11-databases/data-center-v4/intake-v1/${RUN_DATE}.json") |
          | Source raw artifacts | $(state_for "agent-workflow/reports/source-runs/${RUN_DATE}") |
          | Public evidence locator index | $(state_for "01-SiteV2/content/01-raw/source-index.jsonl") |
          | Data Center V4 bundle | $(state_for "01-SiteV2/content/11-databases/data-center-v4/${RUN_DATE}/manifest.json") |
          | Funding Insights application bundle | $(state_for "01-SiteV2/content/12-applications/funding-insights/${RUN_DATE}.json") |
          | Funding Insights frontstage | $(state_for "01-SiteV2/site/data/funding-insights-v1.json") |
          | Opportunity Map V4 evidence | $(state_for "01-SiteV2/site/data/opportunity-evidence-v2.json") |
          | Operations dashboard data | $(state_for "01-SiteV2/site/data/pipeline-dashboard.json") |

          ## Persistence Rule

          The Data Center V4 bundle must be committed only after its integrity gate passes.
          Structured intake and private evidence objects replace new candidate-index Markdown; the public repository retains only body-free locators.
          Accepted V4 facts persist after the V4 integrity/materialization gate.
          Compatibility writers are disabled; frozen compatibility output remains read-only in the archive.
          First-line viewpoints data is produced by the independent first-line workflow.
          EOF

          cat > "agent-workflow/reports/${RUN_DATE}-persistent-asset-manifest.json" <<EOF
          {
            "date": "${RUN_DATE}",
            "generated_at": "$(date -Is)",
            "workflow_mode": "business_signals_pr",
            "resumed_from_run": "${{ steps.resume-artifact.outputs.source_run_id }}",
            "outcomes": {
              "monitor": "${{ steps.resume-artifact.outputs.used == 'true' && 'restored' || steps.monitor.outcome }}",
              "structured_intake_gate": "${{ steps.persistent-assets-post-monitor.outcome }}",
              "data_center_v4_build": "${{ steps.data-center-v4.outcome }}",
              "data_center_v4_gate": "${{ steps.data-center-v4-gate.outcome }}",
              "data_center_v4_materialize": "${{ steps.data-center-v4-materialize.outcome }}",
              "opportunity_map_v4": "${{ steps.opportunity-map-v4.outcome }}",
              "trend_radar_projection": "${{ steps.trend-radar-projection.outcome }}",
              "funding_insights": "${{ steps.funding-insights.outcome }}",
              "operations_data_sync": "${{ steps.operations-data.outcome }}",
              "pre_commit_gate": "${{ steps.pre-commit-gate.outcome }}"
            },
            "assets": {
              "structured_intake": "$(state_for "01-SiteV2/content/11-databases/data-center-v4/intake-v1/${RUN_DATE}.json")",
              "source_intake_artifacts": "$(state_for "agent-workflow/reports/source-runs/${RUN_DATE}")",
              "public_evidence_locators": "$(state_for "01-SiteV2/content/01-raw/source-index.jsonl")",
              "data_center_v4_bundle": "$(state_for "01-SiteV2/content/11-databases/data-center-v4/${RUN_DATE}/manifest.json")",
              "trend_radar_frontstage": "$(state_for "01-SiteV2/site/data/trend-radar-v1.json")",
              "funding_insights_frontstage": "$(state_for "01-SiteV2/site/data/funding-insights-v1.json")",
              "opportunity_map_v4_evidence": "$(state_for "01-SiteV2/site/data/opportunity-evidence-v2.json")",
              "operations_dashboard_data": "$(state_for "01-SiteV2/site/data/pipeline-dashboard.json")"
            }
          }
          EOF

      - name: Upload business signals PR artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wavesight-business-signals-pr-${{ steps.run-date.outputs.date }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            agent-workflow/reports/${{ steps.run-date.outputs.date }}-github-daily-persistent-assets-pr.md
            agent-workflow/reports/source-runs/${{ steps.run-date.outputs.date }}/**
            agent-workflow/reports/${{ steps.run-date.outputs.date }}-github-persistent-assets-pr-*.log
            agent-workflow/reports/${{ steps.run-date.outputs.date }}-persistent-asset-manifest.md
            agent-workflow/reports/${{ steps.run-date.outputs.date }}-persistent-asset-manifest.json
            agent-workflow/reports/${{ steps.run-date.outputs.date }}-guanlan-*.md
            agent-workflow/reports/${{ steps.run-date.outputs.date }}-daily-production-chain-readiness.md
            agent-workflow/reports/${{ steps.run-date.outputs.date }}-data-center-v4-integrity-gate.md
            agent-workflow/reports/${{ steps.run-date.outputs.date }}-data-center-v4-integrity-gate.json
            agent-workflow/reports/frontstage-regression-gate-*.md
            01-SiteV2/content/01-raw/source-index.jsonl
            01-SiteV2/content/11-databases/source-title-translations.json
            01-SiteV2/content/11-databases/data-center-v4/intake-v1/${{ steps.run-date.outputs.date }}.json
            01-SiteV2/content/11-databases/data-center-v4/${{ steps.run-date.outputs.date }}/**
            data-lake/manifest.json
            data-lake/tables/*.jsonl
            01-SiteV2/site/data/data-center-v4-frontstage.json
            01-SiteV2/site/data/data-center-v4/**
            01-SiteV2/site/data/trend-radar-v1.json
            01-SiteV2/content/12-applications/funding-insights/${{ steps.run-date.outputs.date }}.json
            01-SiteV2/content/12-applications/funding-insights/entity-review-queue.json
            01-SiteV2/site/data/funding-insights-v1.json
            01-SiteV2/site/data/opportunity-evidence-v2.json
            01-SiteV2/site/data/collection-telemetry-v1.json
            01-SiteV2/site/data/pipeline-dashboard.json
            01-SiteV2/site/data/pipeline-dashboard.js
            01-SiteV2/site/data/ops-console.json
            01-SiteV2/site/data/ops-console.js

      - name: Commit Data Center V4 assets
        id: commit
        if: always() && steps.pre-commit-gate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/business-signals-${RUN_DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"

          stage_if_exists() {
            local path="$1"
            if [ -e "$path" ]; then
              git add "$path"
            fi
          }

          stage_if_exists "agent-workflow/reports/${RUN_DATE}-github-daily-persistent-assets-pr.md"
          stage_if_exists "agent-workflow/reports/${RUN_DATE}-daily-production-chain-readiness.md"
          stage_if_exists "agent-workflow/reports/${RUN_DATE}-data-center-v4-integrity-gate.md"
          stage_if_exists "agent-workflow/reports/${RUN_DATE}-data-center-v4-integrity-gate.json"
          stage_if_exists "agent-workflow/reports/${RUN_DATE}-persistent-asset-manifest.md"
          stage_if_exists "agent-workflow/reports/${RUN_DATE}-persistent-asset-manifest.json"
          stage_if_exists "agent-workflow/reports/${RUN_DATE}-guanlan-daily-monitor-log.md"
          stage_if_exists "agent-workflow/reports/${RUN_DATE}-guanlan-daily-monitor-quality-loop.md"
          stage_if_exists "agent-workflow/reports/${RUN_DATE}-guanlan-monitor-quality-gate.md"

          if [ "${{ steps.data-center-v4-materialize.outcome }}" = "success" ]; then
            stage_if_exists "01-SiteV2/content/01-raw/source-index.jsonl"
            stage_if_exists "01-SiteV2/content/11-databases/source-title-translations.json"
            stage_if_exists "01-SiteV2/content/11-databases/data-center-v4/intake-v1/${RUN_DATE}.json"
            stage_if_exists "01-SiteV2/content/11-databases/data-center-v4/${RUN_DATE}"
            stage_if_exists "01-SiteV2/content/11-databases/model-assist-v1/${RUN_DATE}.json"
            stage_if_exists "01-SiteV2/content/11-databases/model-assist-v1/checkpoint.json"
            stage_if_exists "01-SiteV2/site/data/data-center-v4-frontstage.json"
            stage_if_exists "01-SiteV2/site/data/data-center-v4"
          fi

          if [ "${{ steps.trend-radar-projection.outcome }}" = "success" ]; then
            stage_if_exists "01-SiteV2/site/data/trend-radar-v1.json"
          fi

          if [ "${{ steps.funding-insights.outcome }}" = "success" ]; then
            stage_if_exists "01-SiteV2/content/12-applications/funding-insights/${RUN_DATE}.json"
            stage_if_exists "01-SiteV2/content/12-applications/funding-insights/entity-review-queue.json"
            stage_if_exists "01-SiteV2/site/data/funding-insights-v1.json"
          fi

          if [ "${{ steps.opportunity-map-v4.outcome }}" = "success" ]; then
            stage_if_exists "01-SiteV2/site/data/opportunity-evidence-v2.json"
          fi

          if [ "${{ steps.operations-data.outcome }}" = "success" ]; then
            stage_if_exists "01-SiteV2/site/data/collection-telemetry-v1.json"
            stage_if_exists "01-SiteV2/site/data/pipeline-dashboard.json"
            stage_if_exists "01-SiteV2/site/data/pipeline-dashboard.js"
            stage_if_exists "01-SiteV2/site/data/ops-console.json"
            stage_if_exists "01-SiteV2/site/data/ops-console.js"
          fi

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Persist Data Center V4 assets for ${RUN_DATE}"
          git push --force-with-lease origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update PR
        id: pr
        if: always() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PR_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ steps.commit.outputs.branch }}"
          manual_url="https://github.com/${GITHUB_REPOSITORY}/pull/new/${branch}"
          body_file="$(mktemp)"
          cat > "$body_file" <<BODY
          Data Center V4 update for ${RUN_DATE}.

          What this PR contains:
          - Structured SourceArtifact / RawDocument intake and body-free evidence locators; complete originals are committed only to the private evidence repository.
          - Data Center V4 factual bundle generated, gated, and materialized before application projections.
          - Opportunity Map, Trend Radar, and Funding Insights generated from V4 evidence.
          - Operations dashboard data included after V4 materialization.
          - Retired compatibility writers remain disabled; archived compatibility assets are not staged or deployed.
          - Persistent asset manifest for production recovery.
          - Artifacts uploaded for review.

          Guardrails:
          - No direct main push.
          - Auto-merge requires the Data Center V4 integrity/materialization chain; failed compatibility gates cannot block accepted V4 facts.
          - No direct deploy from the automation branch; GitHub Pages deploys after main is updated.
          - No stopped content-output lane is executed.

          Automation result:
          - This PR is expected to auto-merge after gates pass.
          - After merge, GitHub Pages deploys from main automatically.
          - Pull main locally or let the WaveSight local sync task fast-forward main and refresh the external Guanlan AI Vault after merge.
          BODY

          pr_number="$(gh pr list \
            --base main \
            --head "$branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$pr_number" ]; then
            pr_url="$(gh pr view "$pr_number" --json url --jq .url)"
            gh pr edit "$pr_number" \
              --title "Business Signals update ${RUN_DATE}" \
              --body-file "$body_file"
            echo "Updated PR #${pr_number}"
            echo "status=updated" >> "$GITHUB_OUTPUT"
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
            echo "manual_url=$manual_url" >> "$GITHUB_OUTPUT"
          else
            if pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "Business Signals update ${RUN_DATE}" \
              --body-file "$body_file" 2>pr-create-error.log)"; then
              pr_number="$(gh pr list \
                --base main \
                --head "$branch" \
                --state open \
                --json number \
                --jq '.[0].number // empty')"
              if [ -z "$pr_number" ]; then
                echo "Created PR but could not resolve its open PR number for branch $branch" >&2
                exit 1
              fi
              echo "$pr_url"
              echo "status=created" >> "$GITHUB_OUTPUT"
              echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
              echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
              echo "manual_url=$manual_url" >> "$GITHUB_OUTPUT"
            else
              cat pr-create-error.log >&2
              if grep -Eqi "not permitted to create.*pull requests|GitHub Actions is not permitted" pr-create-error.log; then
                {
                  echo "### Business Signals PR branch is ready"
                  echo
                  echo "Business Signals assets were generated and the automation branch was pushed."
                  echo
                  echo "GitHub repository settings currently block GitHub Actions from creating pull requests with the default token."
                  echo
                  echo "- Branch: \`$branch\`"
                  echo "- Manual PR: $manual_url"
                  echo
                  echo "To make this fully automatic, enable the repository setting that allows GitHub Actions to create and merge pull requests, or provide a \`GH_PR_TOKEN\` secret with pull request write permission."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "PR creation is blocked by repository settings; manual PR link: $manual_url"
                echo "status=manual_required" >> "$GITHUB_OUTPUT"
                echo "manual_url=$manual_url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

      - name: Auto-merge PR after gates pass
        id: auto-merge
        if: always() && steps.pr.outputs.pr_number != '' && steps.data-center-v4-materialize.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_PR_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="${{ steps.pr.outputs.pr_number }}"
          merge_body="Automated Data Center V4 update after structured intake, factual integrity, application projection, and operations gates passed."

          if gh pr merge "$pr_number" \
            --squash \
            --auto \
            --delete-branch \
            --subject "Persist business signals for ${RUN_DATE}" \
            --body "$merge_body" \
            2>auto-merge-error.log; then
            echo "status=enabled_or_merged" >> "$GITHUB_OUTPUT"
            echo "Auto-merge enabled or completed for PR #${pr_number}."
            exit 0
          fi

          cat auto-merge-error.log >&2

          if grep -Eqi "auto-merge.*disabled|not enabled for this repository|GraphQL:.*auto.?merge" auto-merge-error.log; then
            echo "Repository auto-merge is not available; attempting immediate merge after gates passed."
            if gh pr merge "$pr_number" \
              --squash \
              --delete-branch \
              --subject "Persist business signals for ${RUN_DATE}" \
              --body "$merge_body" 2>immediate-merge-error.log; then
              echo "status=merged" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat immediate-merge-error.log >&2
            if grep -Eqi "merge conflicts|not mergeable|mergePullRequest" immediate-merge-error.log; then
              echo "status=publication_waiting" >> "$GITHUB_OUTPUT"
              echo "Production and quality gates passed; PR #${pr_number} is waiting for publication conflict repair." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit 1
          fi

          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Business signals PR result
        if: always()
        shell: bash
        run: |
          node agent-workflow/tools/classify-business-signals-production-state.mjs \
            --skip="${{ steps.existing-assets.outputs.skip }}" \
            --skipReason="${{ steps.existing-assets.outputs.reason }}" \
            --monitor="${{ steps.resume-artifact.outputs.used == 'true' && 'success' || steps.monitor.outcome }}" \
            --evidenceGate="${{ steps.persistent-assets-post-monitor.outcome }}" \
            --dataCenterBuild="${{ steps.data-center-v4.outcome }}" \
            --dataCenterGate="${{ steps.data-center-v4-gate.outcome }}" \
            --dataCenterMaterialize="${{ steps.data-center-v4-materialize.outcome }}" \
            --opportunity="${{ steps.opportunity-map-v4.outcome }}" \
            --trend="${{ steps.trend-radar-projection.outcome }}" \
            --funding="${{ steps.funding-insights.outcome }}" \
            --compatibilityRetired=true \
            --operations="${{ steps.operations-data.outcome }}" \
            --freshness="${{ steps.pre-commit-gate.outcome }}" \
            --commit="${{ steps.commit.outcome }}" \
            --changed="${{ steps.commit.outputs.changed }}" \
            --pr="${{ steps.pr.outcome }}" \
            --prStatus="${{ steps.pr.outputs.status }}" \
            --merge="${{ steps.auto-merge.outcome }}" \
            --mergeStatus="${{ steps.auto-merge.outputs.status }}"
