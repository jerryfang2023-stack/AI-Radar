name: WaveSight Daily Production Chain Dry Run

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Asia/Shanghai date to run, formatted as YYYY-MM-DD. Leave empty for today."
        required: false
        type: string
      pass_score:
        description: "Source-intake diagnostic score reference. V4 integrity, application projection, and frontstage gates decide release."
        required: false
        default: "85"
        type: string

permissions:
  contents: read

concurrency:
  group: wavesight-daily-production-chain-dry-run-${{ github.event.inputs.date || github.run_id }}
  cancel-in-progress: false

jobs:
  production-chain:
    name: Full Production Chain Dry Run
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai
      ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_FLASH_MODEL: deepseek-v4-flash
      DEEPSEEK_PRO_MODEL: deepseek-v4-pro
      GUANLAN_EVIDENCE_BACKUP_ROOT: ${{ github.workspace }}/../WaveSight-private-evidence

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out authoritative private evidence store
        env:
          PRIVATE_EVIDENCE_SSH_KEY: ${{ secrets.PRIVATE_EVIDENCE_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_EVIDENCE_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_EVIDENCE_SSH_KEY" > "$HOME/.ssh/wavesight_private_evidence"
          chmod 600 "$HOME/.ssh/wavesight_private_evidence"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/wavesight_private_evidence -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth=1 git@github.com:jerryfang2023-stack/WaveSight-private-evidence.git "$GUANLAN_EVIDENCE_BACKUP_ROOT"
          echo "GIT_SSH_COMMAND=$GIT_SSH_COMMAND" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert private evidence remote boundary
        run: npm run assert:private-evidence-remote

      - name: Resolve run date
        id: run-date
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            run_date="${{ github.event.inputs.date }}"
          else
            run_date="$(TZ=Asia/Shanghai date +%F)"
          fi

          if ! [[ "$run_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $run_date" >&2
            exit 2
          fi

          echo "date=$run_date" >> "$GITHUB_OUTPUT"
          echo "RUN_DATE=$run_date" >> "$GITHUB_ENV"

      - name: Report cloud dependency state
        shell: bash
        run: |
          {
            echo "# GitHub Daily Production Chain Dry Run"
            echo
            echo "- date: ${RUN_DATE}"
            echo "- generated_at: $(date -Is)"
            echo "- anysearch_secret: $([ -n "$ANYSEARCH_API_KEY" ] && echo configured || echo missing)"
            echo "- tavily_secret: $([ -n "$TAVILY_API_KEY" ] && echo configured || echo missing)"
            echo "- exa_secret: $([ -n "$EXA_API_KEY" ] && echo configured || echo missing)"
            echo "- deepseek_v4_title_translation: $([ -n "$DEEPSEEK_API_KEY" ] && echo configured || echo missing)"
            echo
            echo "This workflow is a dry run. It uploads artifacts only and never commits, pushes, opens PRs, commits site data, or deploys."
            echo
            echo "Production order:"
            echo "1. Run the V4 source-intake gate."
            echo "2. Confirm structured intake integrity and historical duplicate state."
            echo "3. Mark same-date V4 projections stale if source intake changed."
            echo "4. Build and gate the Data Center V4 factual bundle."
            echo "5. Materialize V4 JSONL serving tables."
            echo "6. Build Opportunity Map, Trend Radar, and Funding Insights projections."
            echo "7. Sync operations data after V4 materialization, still artifact-only."
          } | tee "agent-workflow/reports/${RUN_DATE}-github-daily-production-chain-dry-run.md"

      - name: Syntax checks
        shell: bash
        run: |
          node --check agent-workflow/tools/run-guanlan-daily-monitor.mjs
          node --check agent-workflow/tools/run-guanlan-daily-monitor-with-qc.mjs
          node --check agent-workflow/tools/assert-daily-production-chain.mjs
          node --check agent-workflow/tools/build-data-center-v4.mjs
          node --check agent-workflow/tools/assert-data-center-v4.mjs
          node --check agent-workflow/tools/build-guanlan-vault.mjs
          node --check agent-workflow/tools/assert-tag-taxonomy-v4.mjs
          node --check agent-workflow/tools/sync-light-data-lake.mjs
          node --check 01-SiteV2/site/scripts/build-data-center-v4-frontstage.mjs
          node --check 01-SiteV2/site/scripts/build-industry-reports-frontstage.mjs
          node agent-workflow/tools/assert-compatibility-retirement.mjs
          node agent-workflow/tools/assert-business-signals-pipeline-policy.mjs
          node --check agent-workflow/tools/classify-business-signals-production-state.mjs
          node --check 01-SiteV2/site/scripts/sync-pipeline-dashboard-data.mjs

      - name: Run Daily Monitor with QC
        id: monitor
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node agent-workflow/tools/run-guanlan-daily-monitor-with-qc.mjs \
            --date="${RUN_DATE}" \
            --pass-score="${{ github.event.inputs.pass_score || '85' }}" \
            --max-cycles=1 \
            --search-limit=200 \
            --search-path-query-limit=5 \
            --gdelt-query-limit=12 \
            --hn-limit=8 \
            --fetch-timeout-ms=20000 \
            --snapshot-timeout-ms=16000 \
            --monitor-timeout-ms=900000 \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-production-monitor-run.log"

      - name: Confirm structured intake and stale state
        id: production-chain-post-monitor
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node agent-workflow/tools/assert-daily-production-chain.mjs \
            --date="${RUN_DATE}" \
            --stage=post-monitor \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-production-post-monitor-gate.log"

      - name: Copy originals to the private store and enforce the public boundary
        id: evidence-boundary
        if: steps.monitor.outcome == 'success' && steps.production-chain-post-monitor.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          npm run assert:private-evidence-remote
          npm run backup:private-evidence
          npm run migrate:private-evidence
          npm run assert:private-evidence-backup
          npm run assert:public-evidence-boundary

      - name: Build Data Center V4 factual bundle
        id: data-center-v4
        if: steps.monitor.outcome == 'success' && steps.production-chain-post-monitor.outcome == 'success' && steps.evidence-boundary.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node agent-workflow/tools/build-data-center-v4.mjs \
            --date="${RUN_DATE}" \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-production-data-center-v4.log"

      - name: Run Data Center V4 integrity gate
        id: data-center-v4-gate
        if: steps.data-center-v4.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node agent-workflow/tools/assert-data-center-v4.mjs \
            --date="${RUN_DATE}" \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-production-data-center-v4-gate.log"

      - name: Materialize Data Center V4 JSONL tables
        id: data-center-v4-materialize
        if: steps.data-center-v4-gate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node agent-workflow/tools/sync-light-data-lake.mjs \
            --v4-only=true \
            --duckdb=skip \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-production-data-center-v4-materialize.log"
          node agent-workflow/tools/assert-data-lake-v4.mjs \
            --duckdb=skip \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-production-data-lake-v4-gate.log"
          node 01-SiteV2/site/scripts/build-data-center-v4-frontstage.mjs \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-production-data-center-v4-frontstage.log"

      - name: Build and gate Opportunity Map V4 projection
        id: opportunity-map-v4
        if: steps.data-center-v4-materialize.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node 01-SiteV2/site/scripts/build-industry-reports-frontstage.mjs \
            --date="${RUN_DATE}" \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-production-opportunity-map-v4.log"
          npm run test:data-center-site:opportunity

      - name: Build and gate Trend Radar projection
        id: trend-radar-projection
        if: steps.data-center-v4-materialize.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node 01-SiteV2/site/scripts/build-trend-radar-frontstage.mjs
          node agent-workflow/tools/assert-trend-radar-v1.mjs
          npm run test:trend-radar

      - name: Build and gate Funding Insights projection
        id: funding-insights
        if: steps.data-center-v4-materialize.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node agent-workflow/tools/generate-funding-insights-deepseek.mjs --date="${RUN_DATE}" --write=true
          node agent-workflow/tools/assert-funding-insights-v1.mjs --date="${RUN_DATE}"
          node 01-SiteV2/site/scripts/build-funding-insights-frontstage.mjs
          npm run test:funding-insights

      - name: Build operations data after V4 materialization
        id: operations-data
        if: always() && steps.data-center-v4-materialize.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node agent-workflow/tools/build-collection-telemetry-v1.mjs \
            --date="${RUN_DATE}" \
            --opportunity="${{ steps.opportunity-map-v4.outcome }}" \
            --trend="${{ steps.trend-radar-projection.outcome }}" \
            --funding="${{ steps.funding-insights.outcome }}" \
            --publication=waiting \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-production-collection-telemetry.log"
          node 01-SiteV2/site/scripts/sync-pipeline-dashboard-data.mjs \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-production-operations-data.log"
          node agent-workflow/tools/build-ops-console-data.mjs

      - name: Confirm V4 pre-commit readiness
        id: pre-commit-gate
        if: steps.data-center-v4-materialize.outcome == 'success' && steps.operations-data.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node agent-workflow/tools/assert-daily-production-chain.mjs \
            --date="${RUN_DATE}" \
            --stage=pre-commit \
            --block-stale=true \
            2>&1 | tee "agent-workflow/reports/${RUN_DATE}-github-production-pre-commit-gate.log"

      - name: Upload full-chain dry-run artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wavesight-daily-production-chain-${{ steps.run-date.outputs.date }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            agent-workflow/reports/${{ steps.run-date.outputs.date }}-github-*.md
            agent-workflow/reports/${{ steps.run-date.outputs.date }}-github-*.log
            agent-workflow/reports/${{ steps.run-date.outputs.date }}-guanlan-*.md
            agent-workflow/reports/${{ steps.run-date.outputs.date }}-daily-production-chain-readiness.md
            agent-workflow/reports/${{ steps.run-date.outputs.date }}-downstream-assets-stale.md
            agent-workflow/reports/${{ steps.run-date.outputs.date }}-data-center-v4-integrity-gate.md
            agent-workflow/reports/${{ steps.run-date.outputs.date }}-data-center-v4-integrity-gate.json
            01-SiteV2/content/01-raw/source-index.jsonl
            01-SiteV2/content/11-databases/data-center-v4/intake-v1/${{ steps.run-date.outputs.date }}.json
            01-SiteV2/content/11-databases/data-center-v4/${{ steps.run-date.outputs.date }}/**
            data-lake/manifest.json
            data-lake/tables/*.jsonl
            01-SiteV2/site/data/opportunity-evidence-v2.json
            01-SiteV2/site/data/trend-radar-v1.json
            01-SiteV2/site/data/funding-insights-v1.json
            01-SiteV2/site/data/pipeline-dashboard.json
            01-SiteV2/site/data/pipeline-dashboard.js

      - name: Full-chain dry-run result
        if: always()
        shell: bash
        run: |
          node agent-workflow/tools/classify-business-signals-production-state.mjs \
            --monitor="${{ steps.monitor.outcome }}" \
            --evidenceGate="${{ steps.production-chain-post-monitor.outcome }}" \
            --dataCenterBuild="${{ steps.data-center-v4.outcome }}" \
            --dataCenterGate="${{ steps.data-center-v4-gate.outcome }}" \
            --dataCenterMaterialize="${{ steps.data-center-v4-materialize.outcome }}" \
            --opportunity="${{ steps.opportunity-map-v4.outcome }}" \
            --trend="${{ steps.trend-radar-projection.outcome }}" \
            --funding="${{ steps.funding-insights.outcome }}" \
            --compatibilityRetired=true \
            --operations="${{ steps.operations-data.outcome }}" \
            --freshness="${{ steps.pre-commit-gate.outcome }}" \
            --commit="success" \
            --changed="false"
