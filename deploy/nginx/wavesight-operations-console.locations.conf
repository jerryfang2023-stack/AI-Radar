# Include inside the HTTPS server block for www.zkdlj.vip.
location = /ops { return 302 /ops/; }
location = /ops/login { return 302 /ops/login/; }

location = /ops/login/ {
    root /var/www/wavesight-ops/current;
    try_files /ops/operations-login.html =404;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
}

location = /ops-auth-check {
    internal;
    proxy_pass http://127.0.0.1:8010/api/v1/admin/auth/session;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /ops/api/ {
    limit_req zone=guanlan_general burst=10 nodelay;
    rewrite ^/ops/api/(.*)$ /api/v1/admin/auth/$1 break;
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}

location ^~ /ops/member-api/ {
    limit_req zone=guanlan_general burst=20 nodelay;
    auth_request /ops-auth-check;
    rewrite ^/ops/member-api/(.*)$ /api/v1/admin/analytics/membership/$1 break;
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}

# Dashboard aggregates are reachable only after the same OPS session check.
# The exact legacy URLs are blocked at the public edge below.
location = /ops/analytics-api/summary {
    auth_request /ops-auth-check;
    proxy_pass http://127.0.0.1:8010/api/v1/analytics/summary;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location = /ops/application-membership-summary {
    auth_request /ops-auth-check;
    proxy_pass http://127.0.0.1:8010/api/v1/analytics/membership/summary;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location = /api/v1/analytics/summary { return 404; }
location = /api/v1/analytics/membership/summary { return 404; }

location ^~ /ops/ {
    auth_request /ops-auth-check;
    error_page 401 =302 /ops/login/;
    root /var/www/wavesight-ops/current;
    try_files $uri $uri/ /ops/operations-console.html;
    add_header Cache-Control "private, no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://members.zkdlj.vip; frame-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
}
