<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>运营后台登录｜观澜 AI</title>
  <style>
    :root { --paper:#fffdf8; --ink:#071827; --muted:rgba(7,24,39,.66); --blue:#0d355c; --gold:#c8a766; --line:rgba(200,167,102,.34); --sans:"Noto Sans SC","Microsoft YaHei",sans-serif; --serif:Georgia,"Noto Serif SC","Songti SC",serif; }
    * { box-sizing:border-box; } body { margin:0; min-width:320px; color:var(--ink); background:radial-gradient(circle at 86% 4%,rgba(200,167,102,.14),transparent 34%),var(--paper); font-family:var(--sans); }
    main { min-height:100dvh; display:grid; place-items:center; padding:24px; } section { width:min(100%,440px); padding:32px; border:1px solid var(--line); border-radius:12px; background:rgba(255,253,248,.9); box-shadow:0 18px 60px rgba(7,24,39,.08); }
    header { margin-bottom:28px; color:var(--blue); } header strong { display:block; font:600 22px/30px var(--serif); } header span { display:block; margin-top:4px; color:var(--muted); font-size:9px; line-height:16px; font-weight:700; letter-spacing:.22em; }
    h1 { margin:0 0 24px; font:600 30px/42px var(--serif); } form { display:grid; gap:14px; } form[hidden] { display:none; } label { display:grid; gap:7px; color:var(--blue); font-size:12px; line-height:18px; font-weight:600; }
    input,button { width:100%; min-height:46px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--blue); font:inherit; } button { cursor:pointer; background:var(--blue); color:var(--paper); font-weight:600; transition:transform 160ms ease,opacity 160ms ease; } button:active { transform:scale(.98); } button:disabled { cursor:not-allowed; opacity:.45; } button.secondary { background:transparent; color:var(--blue); }
    p { min-height:24px; margin:14px 0 0; color:var(--muted); font-size:14px; line-height:24px; } :focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
    @media (max-width:640px) { main { padding:16px; } section { padding:24px 20px; } } @media (prefers-reduced-motion:reduce) { button { transition:none; } }
  </style>
</head>
<body>
  <main><section aria-labelledby="login-title">
    <header><strong>观澜 AI</strong><span>WAVESIGHT AI · OPERATIONS</span></header><h1 id="login-title">运营后台登录</h1>
    <form data-email-form><label>管理员邮箱<input type="email" autocomplete="email" required data-email placeholder="输入已授权邮箱"></label><button type="submit" data-send>发送验证码</button></form>
    <form data-code-form hidden><label>邮箱验证码<input inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required data-code placeholder="6 位验证码"></label><button type="submit" data-verify>登录后台</button><button type="button" class="secondary" data-restart>更换邮箱</button></form>
    <p data-status role="status" aria-live="polite">输入已授权邮箱。</p>
  </section></main>
  <script>
    (()=>{const $=s=>document.querySelector(s);let challenge="";const status=m=>$("[data-status]").textContent=m;const stage=active=>{$("[data-email-form]").hidden=active;$("[data-code-form]").hidden=!active};
    $("[data-email-form]").addEventListener("submit",async e=>{e.preventDefault();const input=$("[data-email]"),button=$("[data-send]"),email=String(input.value||"").trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){status("请输入有效的管理员邮箱。");return}button.disabled=true;status("正在发送验证码…");try{const response=await fetch("/ops/api/challenges",{method:"POST",credentials:"same-origin",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})}),payload=await response.json();if(!response.ok)throw new Error(String(payload?.error?.message||"验证码发送失败").slice(0,120));if(payload?.schemaVersion!=="OPS-AUTH-V1.0"||typeof payload.challengeId!=="string"||payload.challengeId.length<20)throw new Error("登录响应校验失败");challenge=payload.challengeId;input.value="";stage(true);status("验证码已发送至 "+String(payload.emailMasked||"管理员邮箱")+"，10 分钟内有效。");$("[data-code]").focus()}catch(error){status(error.message||"验证码发送失败")}finally{button.disabled=false}});
    $("[data-code-form]").addEventListener("submit",async e=>{e.preventDefault();const input=$("[data-code]"),button=$("[data-verify]"),code=String(input.value||"").trim();input.value="";if(!challenge||!/^\d{6}$/.test(code)){status("请输入 6 位邮箱验证码。");return}button.disabled=true;status("正在登录…");try{const response=await fetch("/ops/api/challenges/"+encodeURIComponent(challenge)+"/verify",{method:"POST",credentials:"same-origin",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify({code})}),payload=await response.json();if(!response.ok)throw new Error(String(payload?.error?.message||"验证码验证失败").slice(0,120));if(payload?.schemaVersion!=="OPS-AUTH-V1.0")throw new Error("登录响应校验失败");location.replace("/ops/")}catch(error){status(error.message||"验证码验证失败")}finally{button.disabled=false}});
    $("[data-restart]").addEventListener("click",()=>{challenge="";$("[data-code]").value="";stage(false);status("输入已授权邮箱。");$("[data-email]").focus()});stage(false)})();
  </script>
</body></html>
